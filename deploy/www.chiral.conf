# Chiral Network Channel — HTTP reverse proxy to the Node.js backend
# on 127.0.0.1:8080.
#
# Included by the port-80 default server block in /etc/nginx/nginx.conf
# via `include conf.d/www.*.conf`. Uses `location ~ ^` (regex matching
# any path) rather than `location ^~ /` because the latter collides
# with the existing `location /` static fallback in nginx.conf:345
# (nginx treats both as the same location key `/`, regardless of
# modifier, and rejects the config).
#
# Nginx resolves matches in this order:
#   1. `location = X` — exact match (e.g. /webdefault/images/logo.jpg)
#   2. `location ^~ X` — longest prefix with stop-regex modifier
#      (e.g. ^~ /.well-known/acme-challenge for Let's Encrypt)
#   3. `location ~ X` — regex, first declared wins
#   4. `location X` — longest prefix
#
# Our regex `^` matches every request, so by being the first regex
# declared in the port-80 server block (www.*.conf is included before
# .location.webstation.conf), it wins against Web Station's own
# identical `location ~ ^` catch-all. Longer prefixes above (like
# the ACME challenge) still win over us, so DSM's cert renewal isn't
# affected. The static fallback `location /` at nginx.conf:345 is a
# plain prefix match and never wins against our regex for any request.
#
# Header forwarding mirrors what Web Station's own reverse proxy
# locations use, so req.ip / req.protocol resolve correctly inside the
# Node app (which calls app.set('trust proxy', ...)).
#
# client_max_body_size: the app accepts 20 GiB video uploads per file
# (see MAX_UPLOAD_BYTES in config.js). Nginx's default is 1 MB and
# would silently 413 any real upload, so we raise it here to match.

location ~ ^ {
    proxy_ignore_headers    X-Accel-Redirect;
    proxy_read_timeout      3600s;
    proxy_set_header        X-Forwarded-By  $server_addr;
    proxy_set_header        X-Real-IP       $remote_addr;
    proxy_set_header        X-HTTPS         $https;
    proxy_set_header        X-Port          $server_port;
    proxy_set_header        X-Real-Port     $remote_port;
    proxy_set_header        Host            $http_host;
    proxy_set_header        Upgrade         $http_upgrade;
    proxy_http_version      1.1;
    proxy_intercept_errors  off;
    proxy_redirect          http://         $scheme://;

    client_max_body_size    20g;

    # Gzip the upstream's text responses. DSM's nginx http block has
    # `gzip on` enabled but `gzip_types` defaults to text/html only —
    # which leaves app.js (~308KB) and style.css (~112KB) shipping
    # uncompressed. These directives apply only inside this proxy
    # location and are safe regardless of DSM defaults. JSON API
    # payloads (collection lists) compress especially well.
    gzip                    on;
    gzip_proxied            any;
    gzip_vary               on;
    gzip_comp_level         6;
    gzip_min_length         1024;
    gzip_types              text/plain text/css text/javascript
                            application/javascript application/json
                            application/xml image/svg+xml
                            application/manifest+json;

    proxy_pass              http://127.0.0.1:8080;
}
